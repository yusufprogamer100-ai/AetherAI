    - name: Create Simple Archive
      run: |
        # Create a simple zip of source files as iOS artifact
        mkdir -p build
        zip -r build/AetherAI-Source.zip Core/ Views/ Models/ App/ Theme/ Assets/ *.plist *.swift 2>/dev/null || true
        echo "✅ AetherAI kaynak kod arşivi oluşturuldu"
        ls -la build/
          
    - name: Upload Source Artifact
      uses: actions/upload-artifact@v3
      with:
        name: AetherAI-iOS-Source
        path: build/AetherAI-Source.zip
        retention-days: 30